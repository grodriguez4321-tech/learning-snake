name: Windows CI

# Coverage matrix (this job is automated and headless):
#
#   Unit tests              engine, curriculum, progress, non-GUI learning loop
#   Qt automated tests      offscreen: sidebar, top bar, Phase 2 UI prerequisites,
#                           application startup (construct + close, no exec loop)
#   GUI smoke               offscreen: run / check / syntax / runtime / timeout
#   Learning-loop harness   offscreen, no manual interaction (tests/e2e_learning_loop.py)
#   Windows process timeout worker CREATE_NEW_PROCESS_GROUP + terminate/kill
#
# Still requires a human on a real Windows desktop (not covered here):
#   visual layout, fonts, DPI/scaling, native window chrome, hover/focus,
#   theme contrast, and any check that needs a learner's eyes.
#   This job sets QT_QPA_PLATFORM=offscreen and must not be treated as a
#   substitute for that visual pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: windows-latest / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: >
          python -m unittest
          tests.test_phase1
          tests.test_curriculum
          tests.test_learning_loop
          tests.test_reliability
          tests.test_ui_prefs
          tests.test_windows_timeout
          -v

      - name: Qt automated tests (offscreen)
        run: >
          python -m unittest
          tests.test_ui_phase2_prerequisites
          tests.test_sidebar
          tests.test_top_bar
          tests.test_app_startup
          -v

      - name: Complete unittest suite
        run: python -m unittest discover -s tests -v

      - name: GUI smoke (offscreen; not a visual review)
        timeout-minutes: 3
        run: python tests/smoke_gui.py

      - name: Learning-loop harness (automated; no manual interaction)
        timeout-minutes: 4
        run: python tests/e2e_learning_loop.py
